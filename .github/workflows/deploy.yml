# Tests and builds every push. Pushes to main also publish the site to GitHub Pages,
# with the signed Android app at arcane-tome.apk, the iPad/iPhone app at arcane-tome.ipa and
# the Mac app at arcane-tome-mac.dmg next to it.
#
# The iPad app is built unsigned: Apple installs apps only when signed for the device, so a
# sideloading tool (AltStore, SideStore) signs it with the person's own Apple ID. Publishing on
# the App Store or TestFlight would need a paid Apple Developer account and signing secrets.
# The Mac app (desktop/, Electron around the same web build) is signed ad hoc for the same
# reason: macOS asks once to allow it (System Settings → Privacy & Security → Open Anyway).
#
# One-time setup:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → secret ANDROID_SIGNING_KEY
#     ("password:base64-of-the-.p12"). Without it the Android job still builds a test APK
#     (kept as a workflow artifact) but nothing is published, because every release must be
#     signed with the same key for updates to install over the previous version.
name: Test, build and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    env:
      SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Unpack the signing key
        if: env.SIGNING_KEY != ''
        run: |
          password="${SIGNING_KEY%%:*}"
          echo "::add-mask::$password"
          printf '%s' "${SIGNING_KEY#*:}" | base64 -d > "$RUNNER_TEMP/release.p12"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo "ANDROID_KEY_ALIAS=arcanetome"
          } >> "$GITHUB_ENV"
      - name: Build the APK
        id: build
        working-directory: android
        run: |
          version=$(node -p "require('../package.json').version")
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then task=assembleRelease; kind=release; signed=yes; else task=assembleDebug; kind=debug; signed=no; fi
          ./gradlew --no-daemon "$task" -PversionCode=${{ github.run_number }} -PversionName="$version"
          mkdir -p ../apk
          cp "app/build/outputs/apk/$kind/app-$kind.apk" ../apk/arcane-tome.apk
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "Built $kind APK $version (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/arcane-tome.apk
          retention-days: 14

  ios:
    # Capacitor 8 needs Xcode 26, which the macOS 26 runners have.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:native
      - run: npx cap sync ios
      - name: Build the iPad app (unsigned IPA)
        working-directory: ios/App
        run: |
          xcodebuild -version
          version=$(node -p "require('../../package.json').version")
          xcodebuild -quiet -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          app="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/App.app"
          # Check the app has what the sheet relies on, so a broken project fails here rather than on an iPad.
          test -f "$app/App" && test -f "$app/public/index.html"
          for key in UIFileSharingEnabled LSSupportsOpeningDocumentsInPlace NSCameraUsageDescription CFBundleIcons~ipad; do
            plutil -extract "$key" raw "$app/Info.plist" >/dev/null || { echo "::error::Info.plist is missing $key"; exit 1; }
          done
          grep -aq KeepAwakePlugin "$app/App" || { echo "::error::The KeepAwake plugin was not compiled in"; exit 1; }
          grep -raq '3App14ViewController' "$app/Base.lproj/Main.storyboardc" || { echo "::error::Main.storyboard does not use the app's ViewController"; exit 1; }
          echo "Version $(plutil -extract CFBundleShortVersionString raw "$app/Info.plist") ($(plutil -extract CFBundleVersion raw "$app/Info.plist")), iOS $(plutil -extract MinimumOSVersion raw "$app/Info.plist")+, $(du -sh "$app" | cut -f1)"
          ls "$app" "$app/Frameworks"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" ../../ipa
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/ipa/arcane-tome.ipa" Payload)
          echo "Built unsigned iPad/iPhone app $version (build ${{ github.run_number }}), $(du -h ../../ipa/arcane-tome.ipa | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ipa/arcane-tome.ipa
          retention-days: 14

  mac:
    # One app for Apple silicon and Intel Macs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build:native
      - name: Build the Mac app
        working-directory: desktop
        run: |
          npm ci
          cp -R ../dist-native app
          version=$(node -p "require('../package.json').version")
          # The icon at every size macOS uses.
          mkdir -p build/icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon-1024.png --out build/icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s * 2)) $((s * 2)) icon-1024.png --out build/icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns
          npx electron-packager . "Arcane Tome" --platform=darwin --arch=universal \
            --icon=build/icon.icns --app-bundle-id=io.github.death7310.arcanetome \
            --app-version="$version" --build-version=${{ github.run_number }} \
            --app-category-type=public.app-category.role-playing-games \
            --ignore='^/(build|out|dmg|node_modules|icon-1024\.png|\.gitignore)' --out=out --overwrite
          app="out/Arcane Tome-darwin-universal/Arcane Tome.app"
          # Signed ad hoc, so macOS offers "Open Anyway" once instead of calling it damaged.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          echo "Architectures: $(lipo -archs "$app/Contents/MacOS/Arcane Tome")"
          # Open the finished app: the sheet must draw and be able to save.
          "$app/Contents/MacOS/Arcane Tome" --smoke-test
          mkdir -p dmg ../mac
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Arcane Tome" -srcfolder dmg -fs HFS+ -format UDZO -ov ../mac/arcane-tome-mac.dmg && break
            sleep 5
          done
          test -f ../mac/arcane-tome-mac.dmg
          echo "Built the Mac app $version (build ${{ github.run_number }}), $(du -h ../mac/arcane-tome-mac.dmg | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: mac/arcane-tome-mac.dmg
          retention-days: 14

  pages:
    if: always() && needs.web.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, android, ios, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      - if: needs.android.outputs.signed == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: site
      - if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: site
      - if: needs.mac.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
